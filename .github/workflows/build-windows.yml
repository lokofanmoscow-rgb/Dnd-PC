name: Сборка Windows .exe

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Тесты движка правил
        run: npm test

      - name: Сборка portable .exe
        run: npx electron-builder --win portable --x64 --publish never -c.win.signAndEditExecutable=true
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Загрузка артефакта
        uses: actions/upload-artifact@v4
        with:
          name: DnD-Battle-Table-windows
          path: dist/DnD-Battle-Table.exe

      - name: Публикация релиза (для тегов v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DnD-Battle-Table.exe
